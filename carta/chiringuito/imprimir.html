<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carta impresa — El Chiringuito</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Kaushan+Script&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#1C1B18;--tinta-dim:#6b6258;--ambar:#B8892A;--verde:#1F3C38;
    --display:'Anton',sans-serif;--accent:'Kaushan Script',cursive;--texto:'Jost',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#fff;color:var(--tinta);font-family:var(--texto);font-weight:300}
  .hoja{max-width:900px;margin:0 auto;padding:36px 30px 60px}

  .barra-accion{display:flex;justify-content:center;gap:10px;padding:16px;background:#f1ede4}
  .barra-accion button{
    font-family:var(--texto);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    color:#fff;background:var(--verde);border:none;border-radius:999px;padding:12px 26px;cursor:pointer;
  }

  header{text-align:center;border-bottom:2px solid var(--tinta);padding-bottom:18px;margin-bottom:26px}
  .cinta{
    display:inline-block;font-size:10px;font-weight:600;letter-spacing:.34em;text-transform:uppercase;
    color:var(--verde);margin-bottom:8px;
  }
  h1{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:50px;letter-spacing:.01em;line-height:1}
  h1 span{display:block;font-family:var(--accent);text-transform:none;font-size:.44em;color:var(--ambar);margin-top:4px}
  .sub{margin-top:8px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--tinta-dim)}

  .grid-cols{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start}
  @media (max-width:640px){ .grid-cols{grid-template-columns:1fr} }
  @media print{ .grid-cols{grid-template-columns:1fr 1fr!important} }

  section{margin-bottom:26px}
  h2{
    font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:22px;letter-spacing:.05em;
    color:var(--verde);border-bottom:1px solid var(--tinta);padding-bottom:6px;margin-bottom:13px;
  }
  .item{break-inside:avoid;margin-bottom:13px}
  .fila{display:flex;align-items:baseline;gap:6px}
  .fila .nombre{font-size:19px;font-weight:500;white-space:nowrap}
  .fila .puntos{flex:1;border-bottom:1px dotted #b8b0a2;position:relative;top:-4px}
  .fila .precio{font-family:var(--display);font-weight:400;font-size:19px;color:var(--ambar);white-space:nowrap}
  .item .desc{font-size:14.5px;color:var(--tinta-dim);margin-top:2px;line-height:1.4}

  .adicionales{margin-top:6px;padding:9px 11px;background:#f6f3ec;border-radius:6px;font-size:13px}

  footer{margin-top:30px;padding-top:16px;border-top:1px solid #ddd;text-align:center;font-size:11px;color:var(--tinta-dim)}

  @media print{
    .barra-accion{display:none}
    @page{ size:A4; margin:14mm }
  }
</style>
</head>
<body>
<div class="barra-accion"><button onclick="window.print()">Imprimir / Guardar PDF</button></div>

<div class="hoja">
  <header>
    <div class="cinta">Grupo El Chiringuito</div>
    <h1>El Chiringuito<span>Food &amp; Drinks</span></h1>
    <div class="sub">Mendoza 1578, Paseo Mendoza · Ingeniero Maschwitz</div>
  </header>

  <div id="cargando">Cargando la carta…</div>
  <div class="grid-cols" id="carta" hidden>
    <div id="col-izq"></div>
    <div id="col-der"></div>
  </div>

  <footer>grupochiringuito.com.ar/carta/chiringuito · Escaneá el QR en tu mesa para ver fotos de cada plato</footer>
</div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbyfEynCpShkMtsGMq4wt7JBQIBqWSS74sUvsZdddnHNOW8EJv8u21X8jLGpMxtWlShHKg/exec';
var PALABRAS_BEBIDA = ['trago','cerveza','vino','espumante','bebida','copa','fernet','gin','whisky','cocktail','cóctel','licor','champagne','champán'];

function fmtPrecio(p){ if (p===null||isNaN(p)) return ''; return '$'+Number(p).toLocaleString('es-AR'); }
function esAdicional(p){ var t=String(p.tipo||'').trim().toLowerCase(); return t==='adicional'||t==='opcion'||t==='opción'; }
function esBebida(nombreSeccion){
  var n = nombreSeccion.toLowerCase();
  return PALABRAS_BEBIDA.some(function(palabra){ return n.indexOf(palabra) > -1; });
}
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

function renderSeccion(sec){
  var platos = sec.productos.filter(function(p){ return !esAdicional(p); });
  var adicionales = sec.productos.filter(esAdicional);
  if (!platos.length && !adicionales.length) return '';
  var filas = platos.map(function(p){
    return '<div class="item"><div class="fila"><span class="nombre">'+esc(p.producto)+'</span><span class="puntos"></span><span class="precio">'+fmtPrecio(p.precio)+'</span></div>'+
      (p.descripcion ? '<div class="desc">'+esc(p.descripcion)+'</div>' : '')+'</div>';
  }).join('');
  var extra = adicionales.length ? '<div class="adicionales"><b>'+(adicionales.some(function(a){return a.precio>1;})?'Adicionales':'Opciones')+':</b> '+
    adicionales.map(function(a){ return esc(a.producto) + (a.precio>1?' (+'+fmtPrecio(a.precio)+')':''); }).join(' · ')+'</div>' : '';
  return '<section><h2>'+esc(sec.seccion)+'</h2>'+filas+extra+'</section>';
}

fetch(API_URL).then(function(r){ return r.json(); }).then(function(data){
  var comida = data.secciones.filter(function(s){ return !esBebida(s.seccion); });
  var bebida = data.secciones.filter(function(s){ return esBebida(s.seccion); });
  var seccionesOrdenadas = comida.concat(bebida);

  var colIzqHTML = '', colDerHTML = '';
  var pesoIzq = 0, pesoDer = 0;
  seccionesOrdenadas.forEach(function(sec){
    var peso = sec.productos.length;
    var html = renderSeccion(sec);
    if (pesoIzq <= pesoDer){ colIzqHTML += html; pesoIzq += peso; }
    else { colDerHTML += html; pesoDer += peso; }
  });

  document.getElementById('col-izq').innerHTML = colIzqHTML;
  document.getElementById('col-der').innerHTML = colDerHTML;
  document.getElementById('cargando').hidden = true;
  document.getElementById('carta').hidden = false;
}).catch(function(){
  document.getElementById('cargando').textContent = 'No se pudo cargar la carta. Probá recargar la página.';
});
</script>
</body>
</html>
