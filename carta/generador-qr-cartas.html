<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generador QR — Cartas Grupo El Chiringuito</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --carbon:#171310;--carbon-2:#221C16;--hueso:#F4EEE3;--hueso-dim:#B9AF9E;
    --ambar:#E0A33E;--botella:#2F4A3A;--botella-claro:#456A54;
    --linea:rgba(244,238,227,.12);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:radial-gradient(130% 70% at 50% -10%, rgba(224,163,62,.10), transparent 55%), var(--carbon);
    color:var(--hueso);font-family:'Jost',sans-serif;font-weight:300;
    min-height:100vh;padding:40px 20px 80px;
  }
  .caja{max-width:560px;margin:0 auto;text-align:center}
  .cinta{
    display:inline-block;transform:rotate(-3deg);
    background:linear-gradient(160deg,var(--botella-claro),var(--botella));
    font-weight:500;font-size:11px;letter-spacing:.34em;text-transform:uppercase;
    padding:7px 18px;border-radius:3px;
    box-shadow:0 6px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.14);
  }
  h1{
    font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;
    font-size:clamp(34px,8vw,52px);line-height:1;margin:16px 0 6px;
  }
  .sub{color:var(--hueso-dim);font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:34px}

  label{display:block;text-align:left;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--hueso-dim);margin:22px 0 8px}
  select,input{
    width:100%;padding:14px 16px;border-radius:10px;
    background:var(--carbon-2);color:var(--hueso);
    border:1px solid var(--linea);font-family:'Jost',sans-serif;font-size:15px;
    outline:none;
  }
  select:focus,input:focus{border-color:var(--ambar)}

  .opciones{display:flex;gap:10px;margin-top:22px}
  .opciones button{
    flex:1;cursor:pointer;
    font-family:'Oswald',sans-serif;font-weight:500;font-size:13px;
    letter-spacing:.08em;text-transform:uppercase;color:var(--hueso-dim);
    padding:11px;border-radius:999px;
    background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));
    border:1px solid rgba(244,238,227,.14);
    box-shadow:0 2px 10px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
    transition:all .2s;
  }
  .opciones button.activa{
    color:var(--hueso);
    background:linear-gradient(160deg,var(--botella-claro),var(--botella));
    border-color:rgba(244,238,227,.22);
  }

  #lienzo{
    margin:34px auto 0;padding:26px;border-radius:18px;
    background:var(--hueso);display:inline-block;
    box-shadow:0 18px 50px rgba(0,0,0,.55);
  }
  #qr img,#qr canvas{display:block;width:280px!important;height:280px!important;image-rendering:pixelated}
  .url-mostrada{margin-top:16px;font-size:12.5px;color:var(--hueso-dim);word-break:break-all}

  .descargar{
    display:inline-block;margin-top:28px;cursor:pointer;
    font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;
    letter-spacing:.1em;text-transform:uppercase;color:var(--hueso);
    padding:16px 38px;border-radius:999px;border:1px solid rgba(244,238,227,.2);
    background:linear-gradient(160deg,var(--botella-claro),var(--botella));
    box-shadow:0 8px 20px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.16);
    transition:transform .15s;
  }
  .descargar:active{transform:scale(.97)}
  .nota{margin-top:18px;font-size:12px;color:var(--hueso-dim);line-height:1.6}
</style>
</head>
<body>
<div class="caja">
  <div class="cinta">Grupo El Chiringuito</div>
  <h1>QR de Cartas</h1>
  <div class="sub">Generá e imprimí el QR de cada local</div>

  <label>Carta</label>
  <select id="preset" onchange="usarPreset()">
    <option value="https://grupochiringuito.com.ar/carta/lounge/">Chiringuito Lounge</option>
    <option value="https://grupochiringuito.com.ar/carta/chiringuito/">El Chiringuito</option>
    <option value="https://grupochiringuito.com.ar/carta/unapizza/">Una Pizza Pizzeria</option>
    <option value="https://grupochiringuito.com.ar/carta/focacceria/">La Focacceria</option>
    <option value="https://grupochiringuito.com.ar/carta/bakery/">ChirinBakery</option>
    <option value="otro">Otra URL…</option>
  </select>

  <label>URL destino</label>
  <input id="url" value="https://grupochiringuito.com.ar/carta/lounge/" oninput="regenerar()">

  <div class="opciones">
    <button id="op-marca" class="activa" onclick="setEstilo('marca')">Colores de marca</button>
    <button id="op-clasico" onclick="setEstilo('clasico')">Clásico B/N</button>
  </div>

  <div id="lienzo"><div id="qr"></div></div>
  <div class="url-mostrada" id="urlm"></div>

  <a class="descargar" onclick="descargar()">Descargar PNG (2048px)</a>
  <p class="nota">Nivel de corrección H: el QR sigue funcionando aunque se raye,
  se manche o le pongas un logo encima al imprimirlo.<br>
  Imprimilo mínimo a 3×3 cm. Probá siempre escanearlo antes de mandar a imprenta.</p>
</div>

<script>
var estilo = 'marca';
var COLORES = {
  marca:   {dark:'#171310', light:'#F4EEE3'},
  clasico: {dark:'#000000', light:'#FFFFFF'}
};
var qrVisible = null, qrGrande = null;
var contGrande = document.createElement('div'); // buffer oculto p/ descarga

function urlActual(){ return document.getElementById('url').value.trim(); }

function regenerar(){
  var u = urlActual();
  document.getElementById('urlm').textContent = u;
  document.getElementById('qr').innerHTML = '';
  contGrande.innerHTML = '';
  if (!u) return;
  var c = COLORES[estilo];
  qrVisible = new QRCode(document.getElementById('qr'), {
    text:u, width:280, height:280,
    colorDark:c.dark, colorLight:c.light,
    correctLevel:QRCode.CorrectLevel.H
  });
  qrGrande = new QRCode(contGrande, {
    text:u, width:2048, height:2048,
    colorDark:c.dark, colorLight:c.light,
    correctLevel:QRCode.CorrectLevel.H
  });
  document.getElementById('lienzo').style.background = c.light;
}

function usarPreset(){
  var v = document.getElementById('preset').value;
  if (v !== 'otro'){ document.getElementById('url').value = v; }
  regenerar();
}

function setEstilo(e){
  estilo = e;
  document.getElementById('op-marca').classList.toggle('activa', e==='marca');
  document.getElementById('op-clasico').classList.toggle('activa', e==='clasico');
  regenerar();
}

function nombreArchivo(){
  var sel = document.getElementById('preset');
  var texto = sel.options[sel.selectedIndex].text;
  var slug = texto.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  if (sel.value === 'otro') slug = 'personalizado';
  return 'qr-carta-' + slug + (estilo==='clasico' ? '-bn' : '') + '.png';
}

function descargar(){
  // margen de silencio alrededor (obligatorio para escaneo confiable)
  var canvas = contGrande.querySelector('canvas');
  var img = contGrande.querySelector('img');
  var fuente = canvas;
  if (!fuente && img){
    fuente = document.createElement('canvas');
    fuente.width = 2048; fuente.height = 2048;
    fuente.getContext('2d').drawImage(img, 0, 0, 2048, 2048);
  }
  if (!fuente) return;
  var margen = 160;
  var final = document.createElement('canvas');
  final.width = 2048 + margen*2; final.height = 2048 + margen*2;
  var ctx = final.getContext('2d');
  ctx.fillStyle = COLORES[estilo].light;
  ctx.fillRect(0,0,final.width,final.height);
  ctx.drawImage(fuente, margen, margen);
  var a = document.createElement('a');
  a.download = nombreArchivo();
  a.href = final.toDataURL('image/png');
  a.click();
}

regenerar();
</script>
</body>
</html>
